services:
  frontend:
    build:
      context: ..
      dockerfile: Dockerfile
      args:
        VITE_AUTH_API_BASE: /api/auth
    ports:
      - "80:80"
    depends_on:
      auth-service:
        condition: service_started
    restart: unless-stopped
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: homecare_platform
      MYSQL_USER: homecare
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
      - ../sql/install.sql:/docker-entrypoint-initdb.d/01-install.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped
  auth-service:
    build:
      context: ../backend
      dockerfile: Dockerfile
      args:
        SERVICE_NAME: auth-service
    environment:
      AUTH_DB_URL: jdbc:mysql://mysql:3306/homecare_platform?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
      AUTH_DB_USERNAME: homecare
      AUTH_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped
volumes:
  mysql_data:
